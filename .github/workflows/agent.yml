name: Morning Music Agent

on:
  schedule:
    - cron: '0 22 * * *' # 매일 한국 시간 아침 7시 (UTC 22시) 자동 실행
  workflow_dispatch: # 수동 테스트 버튼 활성화

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WIFE_EMAIL: ${{ secrets.WIFE_EMAIL }}
        run: |
          python main.py
